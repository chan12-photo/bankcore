services:
  mysql:
    image: mysql:8.4
    container_name: bankcore-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: bankcore_root_password
      MYSQL_DATABASE: bankcore
      MYSQL_USER: bankcore
      MYSQL_PASSWORD: bankcore_password
    volumes:
      - bankcore-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  bankcore-mysql-data:
